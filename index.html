<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }

        html,body{
            height: 100%;
        }

        body{
            display: flex;
            align-items: center;
            justify-content: center;
            vertical-align: center;
            flex-wrap:wrap;
            align-content: center;

        }

        [class$="face"]{
            margin:16px;
            padding:4px;
            background-color: #e7e7e7;
            width: 104px;
            height: 104px;
            object-fit: contain;
            border-radius: 10%;
        }
        .pip{
            display: block;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin: 4px;
            background-color: black;
        }
        .first face{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .second-face{
            display: flex;
            justify-content: space-between;
        }

        .second-face .pip:ntn-of-type(2){
            align-self: flex-end;
        }
         .third-face{
            display: flex;
            justify-content: flex-end;
        }

        .third-face .pip:ntn-of-type(2){
            align-self: center;
        }

        .third-face.pip:ntn-of-type(3){
            align-self: end;
        }
         .fourth-face, .sixth-face{
            display: flex;
            justify-content: space-between;
        }

        .fourth-face .column, .sixth-face .column{
         display: flex;
         flex-direction: column;
         justify-content: space-between;
        }

        .fifth-face{
         display:flex;
         justify-content: space-between;
        }

         .fifth-face .column{
         display:flex;
         flex-direction: column;
         justify-content: space-between;
        }

        .fifth-face .column:nth-of-type(2)
        {
            justify-content: center;
        }

    </style>
</head>
<body>
    <div class="first-face">
        <span class="pip"></span>
    </div>

    <div class="second-face">
        <span class="pip"></span>
        <span class="pip"></span>
    </div>


    <div class="third-face">
        <span class="pip"></span>
        <span class="pip"></span>
        <span class="pip"></span>
    </div>
    
    <div class="fourth-face">
        <div class="column">
        <span class="pip"></span>
        <span class="pip"></span>
    </div>
    
    <div class="column">
        <span class="pip"></span>
        <span class="pip"></span>
    </div>

    </div>
    
    <div class="fifth-face">
        <div class="column">
        <span class="pip"></span>
        <span class="pip"></span>
    </div>

    <div class="column">
        <span class="pip"></span>
    </div>

     <div class="column">
        <span class="pip"></span>
        <span class="pip"></span>
    </div>

    </div>

    <div class="sixth-face">
        <div class="column">
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
        </div>

        <div class="column">
            <span class="pip"></span>
            <span class="pip"></span>
            <span class="pip"></span>
        </div>
    </div>

    
</body>
</html>
